name: APK Olustur

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Indir
      uses: actions/checkout@v4

    - name: Java Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Izinleri Ver
      run: chmod +x gradlew

    - name: APK Derle
      run: ./gradlew assembleDebug

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: uygulama-apk
        path: app/build/outputs/apk/debug/app-debug.apk
